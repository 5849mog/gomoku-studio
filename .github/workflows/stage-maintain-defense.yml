name: Stage maintainable protection
on:
  push:
    branches: [codex/gomoku-maintain-defense-20261128]
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:release
      - run: node --test tests/protection-seed.test.js tests/protection-decoys.test.js tests/release-version.test.js tests/service-worker.test.js tests/release-notes.test.js tests/app-update.test.js tests/remote-gateway.test.js tests/remote-http.test.js tests/remote-engine.test.js tests/remote-ui.test.js tests/wordmark.test.js
      - name: Build GitHub Pages output
        uses: actions/jekyll-build-pages@v1
      - run: node scripts/verify-published.js _site
      - name: Test published and development modes
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            npx playwright install --with-deps chromium
          else
            export CHROME_PATH
          fi
          GOMOKU_SITE_ROOT="$PWD/_site" npm run test:protected
          GOMOKU_SITE_ROOT="$PWD/_site" npm run test:protected-remote
          npm run test:dev-source
      - name: Commit generated output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.yml *.protected.js sw.js index.html renju.html about.html about.zh-CN.html report.html update.html
          git diff --cached --quiet || git commit -m "Build layered protected entry scripts"
          git push origin HEAD:codex/gomoku-maintain-defense-20261128
